name: Build verified LSND Zotero package

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build_zotero_lsnd_20260802.yml

permissions:
  contents: read

env:
  PACKAGE_NAME: 2026-08-02_Li_LSNDStripeDetection_Zotero
  PDF_NAME: Li 等 - 2022 - Stripe Noise Detection of High-Resolution Remote Sensing Images Using Deep Learning Method.pdf

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils libxml2-utils zip unzip

      - name: Acquire and validate publisher PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates "$PACKAGE_NAME/files/1" "$PACKAGE_NAME/optional" "$PACKAGE_NAME/editable" "$PACKAGE_NAME/metadata_fallback"

          valid_pdf() {
            local f="$1"
            test -s "$f" || return 1
            test "$(head -c 5 "$f")" = '%PDF-' || return 1
            test "$(stat -c '%s' "$f")" -gt 500000 || return 1
            pdfinfo "$f" >/tmp/pdfinfo.txt 2>/dev/null || return 1
            pdftotext "$f" /tmp/pdftext.txt 2>/dev/null || return 1
            grep -qi 'Stripe Noise Detection of High-Resolution Remote Sensing Images' /tmp/pdftext.txt || return 1
            grep -qi '10.3390/rs14040873' /tmp/pdftext.txt || return 1
            grep -qi 'Binbo Li' /tmp/pdftext.txt || return 1
            grep -qi 'Ying Zhou' /tmp/pdftext.txt || return 1
            test "$(wc -c </tmp/pdftext.txt)" -gt 50000 || return 1
            local pages
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            test "$pages" -ge 28 || return 1
            return 0
          }

          urls=(
            'https://mdpi-res.com/d_attachment/remotesensing/remotesensing-14-00873/article_deploy/remotesensing-14-00873-v2.pdf'
            'https://mdpi-res.com/d_attachment/remotesensing/remotesensing-14-00873/article_deploy/remotesensing-14-00873.pdf'
            'https://www.mdpi.com/2072-4292/14/4/873/pdf'
            'https://www.researchgate.net/publication/journal/Remote-Sensing-2072-4292/publication/358589481_Stripe_Noise_Detection_of_High-Resolution_Remote_Sensing_Images_Using_Deep_Learning_Method/links/657ca7878e2401526dd85219/Stripe-Noise-Detection-of-High-Resolution-Remote-Sensing-Images-Using-Deep-Learning-Method.pdf'
          )
          selected=''
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            out="candidates/candidate_${i}.pdf"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 -A 'Mozilla/5.0' "$url" -o "$out"; then
              if valid_pdf "$out"; then selected="$out"; echo "$url" > /tmp/source_url.txt; break; fi
            fi
          done
          test -n "$selected"
          cp "$selected" "$PACKAGE_NAME/files/1/$PDF_NAME"
          pdfinfo "$PACKAGE_NAME/files/1/$PDF_NAME" | tee /tmp/final_pdfinfo.txt
          pdftotext "$PACKAGE_NAME/files/1/$PDF_NAME" /tmp/final_pdftext.txt
          sha256sum "$PACKAGE_NAME/files/1/$PDF_NAME" | tee /tmp/pdf_sha256.txt

      - name: Build Zotero RDF package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build_package.py <<'PY'
from pathlib import Path
import hashlib, html, json, os, re, zipfile
import xml.etree.ElementTree as ET

root = Path(os.environ['PACKAGE_NAME'])
pdf_name = os.environ['PDF_NAME']
pdf_rel = f'files/1/{pdf_name}'
pdf_path = root / pdf_rel

translation_title = '中英对照翻译｜技术辅助译解，非官方译本'
analysis_title = '精读分析与ColorCast实施建议'

def h(s):
    return html.escape(s, quote=True)

def sha256(path):
    digest = hashlib.sha256()
    with open(path, 'rb') as f:
        for block in iter(lambda: f.read(1024 * 1024), b''):
            digest.update(block)
    return digest.hexdigest()

translation_html = r'''<div>
<h1>中英对照翻译｜技术辅助译解，非官方译本</h1>
<p><strong>译解声明：</strong>本笔记依据 Li 等（2022）的开放获取英文原文制作，是面向遥感影像质量控制研究的技术辅助译解，不是出版社或作者发布的官方中文译本。保留英文题名、章节名、术语和公式编号。证据层级：A=本文直接描述；B=本文引用或沿用的既有方法；C=面向 ColorCast 的工程推导。本文采用 CC BY 4.0 许可。</p>
<h2>p.1｜Title, Abstract, Keywords</h2>
<p><strong>Original title:</strong> Stripe Noise Detection of High-Resolution Remote Sensing Images Using Deep Learning Method<br/><strong>中文译题：</strong>使用深度学习方法的高分辨率遥感影像条纹噪声检测。</p>
<p><strong>Abstract｜摘要译解（A）：</strong>条纹噪声是星载遥感影像的重要质量问题。不同时间、空间条件下条纹形态差异明显，使已有方法的检测能力受限。本文把条纹噪声建模为典型线状目标，提出 Linear Stripe Noise Detection（LSND）算法；通过线性变换构建大规模条纹样本，并用深卷积神经网络完成目标识别。在 GF-2 等亚米级影像上，模型达到 Precision 98.7%、Recall 93.8%、F1 96.1%、AP 92.1%，640 尺度速度为 35.71 FPS。</p>
<p><strong>Keywords:</strong> stripe noise；remote sensing；image quality；deep neural network；linear object detection。中文术语：条纹噪声、遥感、影像质量、深度神经网络、线状目标检测。</p>
<h2>pp.1–4｜1. Introduction and 2. Related Work</h2>
<p><strong>Problem definition（A）：</strong>条纹通常表现为特定行或列比相邻位置偏亮或偏暗，来源包括 CCD 单元光谱响应差异、数据系统定标误差、传感器响应函数不一致，以及电子/链路随机噪声。条纹会模糊地物特征，并影响后续定量应用。</p>
<p><strong>Existing methods（A/B）：</strong>早期方法主要使用周期性、相邻均值/标准差/梯度突变、傅里叶或小波特征；后来使用稀疏约束、分数阶微分与方向结构。作者认为人工特征在多传感器、大幅面和微弱不规则条纹上存在速度或泛化局限，因此引入 CNN 端到端学习。</p>
<p><strong>Object-detection context（B）：</strong>论文回顾 two-stage、one-stage、anchor-based 与 anchor-free 检测器。LSND 的骨架设计以 YOLOv4、CSPDarkNet53、SPP 和 Scaled-YOLOv4 回归参数化为基础，但输出对象从二维框改为一维中心线。</p>
<h2>pp.5–6｜3.1 Stripe Noise Simulation Method</h2>
<p><strong>Radiometric response, Eq. (1)（A）：</strong><br/>D = A T + B + ξ。T 是真实辐亮度，D 是影像灰度/观测值，A 与 B 分别是传感器响应增益和偏置，ξ 是噪声。不同探测单元对同一入射辐射的响应差异会形成条纹。</p>
<p><strong>Patch generation（A）：</strong>整景影像按行列切分为 KSIZE×KSIZE 基本样本，本文 KSIZE=640；不足一块的边缘从右向左或从下向上补取完整样本。</p>
<p><strong>Linear simulation（A）：</strong>把图像沿裁切方向随机分为 M 个小区域，M∈[2,5]。随机增益 α∈[0.75,1.25]，随机偏置 β∈[-5,5]。对后续区域生成 αnew、βnew；若 |αnew−αprevious|&lt;0.2，论文按其规则对 αnew 作 0.2 级调整，再使用相对增益 αnew/αprevious 与偏置 βnew 变换像素。该过程同时可叠加随机噪声。</p>
<h2>pp.7–9｜3.2 LSND Network, Decode and Loss</h2>
<p><strong>Linear target representation（A）：</strong>论文目标是接近从顶部贯穿到底部、长度接近图像高度的竖向条纹。每条候选由 (x, y, h, confidence) 表示；单类别检测再加 class，故每个网格一条 anchor line、输出维度为 1×(4+1)=5。</p>
<p><strong>Architecture（A/B）：</strong>保留 YOLOv4 的 CSPDarknet53 backbone 与 SPP；在 path aggregation 中保留上采样和特征融合，删除重新下采样路径，只保留一个高空间分辨率检测头。作者的动机是线位置对单像素误差更敏感，低分辨率特征图的网格间距会降低定位精度。</p>
<p><strong>Decode, Eq. (2)–(4)（A/B）：</strong><br/>bxy = 2σ(txy) − 0.5 + Cxy；<br/>bh = 4σ(th)²Ph；<br/>σ(x)=1/(1+e^(−x))。<br/>Cxy 为网格左上角坐标，Ph 为先验线长，bxy、bh 为回归结果。</p>
<p><strong>Loss, Eq. (5)（A）：</strong>总损失由 position offset、object confidence、no-object confidence 和 classification 四部分组成。位置权重 α1:α2:α3=4.0:1.0:0.4；k 为输入与输出影像尺寸之比；无目标置信度由 λnoobj 降权。</p>
<h2>pp.9–11｜3.2.3 Linear NMS and 3.3 Large-Scale Detection</h2>
<p><strong>Linear NMS（A）：</strong>候选按置信度降序排列，删除 confidence&lt;0.3 的线。计算最高置信候选与其余候选围成面积占整幅影像面积的比例；阈值设为 1/L，L 为影像宽度。满足论文删除条件的近邻重复线被抑制，迭代至候选处理完毕。</p>
<p><strong>Whole-scene strategy（A）：</strong>对大幅面影像设置两个不同起始行坐标；每个列块随机选取一个 640×640 裁片作为该列代表，运行 LSND 后恢复整景坐标，再执行线 NMS；最后沿行方向连接结果，并把线长转换为整景列向长度。</p>
<h2>pp.11–14｜4. Environment, Dataset and Training</h2>
<p><strong>Environment（A）：</strong>Ubuntu 18.04 LTS；NVIDIA Quadro M4000 16 GB；Python 3.7.4；PyTorch 1.7.1；CUDA 10.1；cuDNN 7.3.1。</p>
<p><strong>Data（A）：</strong>来源包括 WorldView、IKONOS、DigitalGlobe 和 GF-2。原 TIFF 为降低训练数据量被转为 JPG，再切为 640×640。线标签记录 category、center x、center y、length h；为 YOLOv4、RetinaNet、FCOS 生成宽度 W=2 的框标签。训练/验证比例 14:1，训练 178,070 张，验证 12,500 张。</p>
<p><strong>Training protocol（A/B）：</strong>LSND 与 LS-YOLOv4 使用 batch size=4、50 epochs、initial learning rate=0.001、cosine annealing、Adam（β1=0.937，β2=0.999，weight decay=0.005），每 16 个 batch 更新一次参数。前 3 个 epoch warm-up：learning rate 从 0.1 线性调整到余弦策略对应值，β1 从 0.9 线性增至 0.937。使用 EMA 平滑模型参数。</p>
<h2>pp.15–18｜4.4 Metrics, Threshold and Main Results</h2>
<p><strong>Metrics, Eq. (6)–(9)（A/B）：</strong>Precision=TP/(TP+FP)；Recall=TP/(TP+FN)；AP 由不同阈值下的精确率–召回率增量累计；F1=2PR/(P+R)。</p>
<p><strong>Line-match criterion（A）：</strong>对 M×M 影像，当预测线与真值线围成面积占整幅面积的比例小于 1/M 时，判定正确。AP 计算使用论文给出的区间 [(M−1)/M,(10M−1)/(10M)] 内 10 个等间隔阈值。该定义是线目标专用，不等同于普通 IoU。</p>
<p><strong>Table 4, 640 input（A）：</strong>GT=2420。LSND：Precision 98.74%、Recall 93.85%、F1 96.09%、AP 92.07%。LS-YOLOv4：89.98%、93.56%、91.60%、88.84%；YOLOv4：59.43%、62.65%、56.25%、49.08%；RetinaNet：97.66%、16.26%、27.70%、14.56%；FCOS：66.48%、15.79%、23.96%、7.36%。</p>
<p><strong>Small-image robustness（A）：</strong>64×64 数据训练 250,280 张、验证 17,900 张、batch size=512。LSND 为 Precision 94.28%、Recall 86.03%、F1 89.93%、AP 78.86%；LS-YOLOv4 为 79.22%、88.88%、83.19%、80.21%。</p>
<h2>pp.19–23｜4.5–4.6 Detection Results and 5. Conclusions</h2>
<p><strong>Visual and real-image test（A）：</strong>作者在山地、云区、城镇等容易与竖线混淆的复杂背景上比较多种检测器，并使用少量真实条纹影像与模拟样本联合训练。640 尺度推理报告 35.71 FPS。整景示例通过分块、坐标恢复与线连接显示检测结果。</p>
<p><strong>Conclusion（A）：</strong>LSND 将条纹检测改写为线目标检测，通过单一高分辨率头、专用损失和线 NMS 提升了本文数据上的精度与速度，可用于海量遥感影像质量筛查并触发后续针对性处理。</p>
<p><strong>Limitations（A）：</strong>本文主要覆盖接近竖直、近全高条纹；影像校正后可能出现倾斜条纹，作者把 oblique stripe detection 列为后续研究。论文未直接输出条纹宽度、像素级掩膜或校正影像。</p>
<h2>pp.24–28｜Availability and References Boundary</h2>
<p><strong>Code/data availability（A）：</strong>论文写明代码可向作者索取，但未给出公开代码仓库、训练权重和完整训练数据。因而第三方只能进行“论文约束重建”，不能把自行补充的实现细节宣称为作者源码。</p>
<p><strong>Source boundary（B）：</strong>YOLOv4、Scaled-YOLOv4、EMA、Adam、cosine annealing、warm-up 和其他对比检测器属于本文引用/沿用方法；LSND 的线表示、单检测头、损失权重、线 NMS、大图拼接流程与实验结果属于本文直接描述。</p>
</div>'''

analysis_html = r'''<div>
<h1>精读分析与ColorCast实施建议</h1>
<p><strong>文献：</strong>Li, B.; Zhou, Y.; Xie, D.; Zheng, L.; Wu, Y.; Yue, J.; Jiang, S. (2022). Stripe Noise Detection of High-Resolution Remote Sensing Images Using Deep Learning Method. Remote Sensing, 14(4), 873. DOI: 10.3390/rs14040873.</p>
<p><strong>证据分层：</strong>A=论文直接描述；B=论文引用或沿用的方法；C=基于论文与 ColorCast 需求的工程推导，不能写成作者原结论。</p>
<h2>1. 研究问题（A）</h2>
<p>面对高分辨率遥感影像中形态多变、背景复杂且数据量巨大的条纹异常，如何把“是否存在、位于何处”的质量检测问题转化为快速、可训练的线目标检测任务，并在整景大图上恢复全局条纹位置。</p>
<h2>2. 检测对象与数据（A）</h2>
<ul><li>对象：接近从影像顶部贯穿到底部、长度接近影像高度的竖向线状条纹。</li><li>数据来源：WorldView、IKONOS、DigitalGlobe、GF-2，以及少量真实条纹影像。</li><li>训练输入：640×640 JPG；另做 64×64 尺度稳健性实验。</li><li>训练/验证：178,070/12,500（14:1）；小尺度 250,280/17,900。</li><li>标签：category、center x、center y、length；普通检测器使用宽度 W=2 的细框。</li></ul>
<h2>3. 物理模拟与关键公式（A）</h2>
<p><strong>传感器响应：</strong>D=A·T+B+ξ（Eq. 1）。这是 ColorCast 可利用的物理入口：条纹不是简单加性白噪声，而是探测单元的 gain/offset 差异与随机噪声共同作用。</p>
<p><strong>模拟参数：</strong>KSIZE=640；M∈[2,5]；α∈[0.75,1.25]；β∈[-5,5]；相邻增益差小于 0.2 时按论文规则进行 0.2 级调整。</p>
<p><strong>线回归：</strong>bxy=2σ(txy)−0.5+Cxy（Eq. 2）；bh=4σ(th)²Ph（Eq. 3）。</p>
<p><strong>损失：</strong>位置、目标置信度、背景置信度和分类四部分；α1:α2:α3=4.0:1.0:0.4；背景项由 λnoobj 降权。</p>
<h2>4. 网络与后处理（A/B）</h2>
<p>LSND 基于 YOLOv4 的 CSPDarknet53+SPP，删除 PAN 的下采样回流与低分辨率检测头，只保留高分辨率头。每个网格一个 anchor line，单类别输出 5 通道。线 NMS 先删除 confidence&lt;0.3 候选，再以围成面积比例和 1/L 阈值去重。</p>
<h2>5. 训练流程与阈值（A/B）</h2>
<ul><li>batch=4；epochs=50；initial LR=0.001。</li><li>Adam：β1=0.937、β2=0.999、weight decay=0.005。</li><li>每 16 batches 更新；前 3 epochs warm-up；cosine annealing；EMA。</li><li>线匹配：预测线与真值线围成面积/整幅面积&lt;1/M。</li><li>AP：论文给定区间内 10 个等间隔判定阈值。</li></ul>
<h2>6. 实验结果（A）</h2>
<p>640 尺度 LSND：Precision 98.74%、Recall 93.85%、F1 96.09%、AP 92.07%，报告速度 35.71 FPS。相较 LS-YOLOv4、YOLOv4、RetinaNet、FCOS，LSND 在本文验证集的综合线检测指标最高。64 尺度 LSND：Precision 94.28%、Recall 86.03%、F1 89.93%、AP 78.86。</p>
<h2>7. 优点（A）</h2>
<ul><li>把极细长条纹从普通二维框问题改成线定位问题，评价口径与目标几何更匹配。</li><li>提供物理启发的数据模拟、网络、损失、NMS、大图坐标恢复和量化指标的完整链条。</li><li>单高分辨率检测头适合对单像素定位敏感的条纹。</li><li>直接面向遥感影像质量筛查，和 ColorCast 的条带检测职责高度一致。</li></ul>
<h2>8. 缺点与适用边界（A）</h2>
<ul><li>方向范围窄：主要是近全高竖线；横向、斜向、局部短条纹不在论文原始任务合同内。</li><li>不输出条纹宽度、分割掩膜、波段根因或校正结果。</li><li>训练数据大量来自模拟，真实样本数量及独立场景划分不充分公开。</li><li>代码、权重和完整数据未公开，损失掩膜、冲突分配等实现细节存在复现歧义。</li><li>真实大图示例以视觉结果为主，缺少充分的独立真实真值统计。</li></ul>
<h2>9. 复现步骤（A/C）</h2>
<ol><li>锁定论文原始范围：640 输入、单类、近全高竖线、单高分辨率头。</li><li>实现 D=A·T+B+ξ 模拟器及 M、α、β 参数；原始场景必须 source-scene-disjoint 划分，禁止同景切片泄漏到训练和验证。</li><li>实现 line label、Scaled-YOLOv4 风格解码、四项损失与线 NMS。</li><li>先做解析测试：完美预测应得到 F1=1 且损失接近 0；再做 1→4→16 样本过拟合门槛。</li><li>通过小样本闭环后再扩展到论文规模，并记录模型、配置、数据 manifest 和随机种子。</li><li>使用论文线匹配指标，同时增加像素距离、方向误差、跨波段一致性和正常影像 specificity。</li></ol>
<h2>10. 代码与数据可得性（A）</h2>
<p>论文声明代码可向作者索取，但没有公开仓库、权重或完整数据。因此工程实现应标记为 paper-constrained reconstruction，而不是源码级复现；论文表 4 指标不能在未获得同源数据时被宣称复现。</p>
<h2>11. ColorCast 落地方案（C）</h2>
<h3>11.1 职责定位</h3>
<p>建立独立 <strong>StripeDetectionBranch</strong>：LSND 只负责线状条纹候选，不替代整景偏色、亮度分区、条带校正、云雾掩膜、波段配准和 root-cause 判定。</p>
<h3>11.2 输入与掩膜</h3>
<p>保留原始位深和辐射值用于物理证据；网络显示输入可做归一化，但缺失块、黑边、饱和、云雪和无效区必须通过 valid mask 排除，避免把边缘、海岸线、道路和云带误判为条纹。</p>
<h3>11.3 多方向扩展</h3>
<p>论文竖线模型作为一个方向专家。ColorCast 先从影像有效区四边形的两条实际边方向、二维频谱和梯度张量得到候选方向，再进行旋转归一或方向卷积。横/竖/斜向结果必须保留原坐标变换和方向置信度。</p>
<h3>11.4 多波段证据</h3>
<p>单波段线候选需与相邻波段位置、方向、剖面跳变及 gain/offset 模型联合验证。输出不能只有 confidence，还应包括 band_support、profile_jump、spectral_consistency、estimated_gain、estimated_offset 和 root_cause_evidence。</p>
<h3>11.5 大图策略</h3>
<p>概览层在降采样数据上估计方向和候选列；全分辨率层使用 tile+halo。论文的双起点采样可作为快速模式，但生产质检应增加覆盖率审计，确保没有因随机代表块漏检局部条纹。重叠 tile 的线候选在整景坐标中执行方向感知 NMS。</p>
<h3>11.6 推荐接口</h3>
<pre>StripeDetectionResult detect(image, valid_mask, band_metadata,
                             candidate_directions,
                             tile_size=640, halo=64,
                             confidence=0.30)</pre>
<p>输出建议：lines[x,y,length,width,direction,confidence]、per_band_support、source_tiles、nms_trace、quality_score、evidence_level、reject_reason。</p>
<h3>11.7 生产验收</h3>
<ul><li>模拟数据：按 gain、offset、宽度、方向、长度、强度和背景类型分层统计 Precision/Recall/F1/AP。</li><li>真实数据：正常影像 specificity、专家标注一致性、跨波段位置误差、方向误差和整景漏检率。</li><li>大图资源：wall time、峰值 RSS、GPU 显存、tile 覆盖率和结果拼接一致性。</li><li>任何候选模型在正常影像误报、微弱条纹召回和真实场景 gate 未通过前，不替换现有生产判定。</li></ul>
</div>'''

